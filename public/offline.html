<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Kayala Farm</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: #05070b;
        color: #f0f0f4;
        text-align: center;
        padding: 2rem;
      }
      .icon {
        font-size: 3rem;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.35rem;
        margin-bottom: 0.5rem;
      }
      p {
        color: #8e8e93;
        margin-bottom: 1.5rem;
        line-height: 1.6;
      }
      button {
        background: #11834d;
        color: #fff;
        border: none;
        padding: 0.75rem 1.75rem;
        border-radius: 12px;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="icon">📡</div>
    <h1>Tidak Ada Koneksi Internet</h1>
    <p>
      Kayala Farm membutuhkan internet untuk sinkronisasi data cloud.<br />
      Periksa koneksi lalu coba lagi.
    </p>
    <button type="button" onclick="window.location.reload()">Coba Lagi</button>
  </body>
</html>
